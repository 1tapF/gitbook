$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Crust Docs
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: section-2
      title: Documentation
      path: documentation
      icon: book-blank
      children:
        - type: space
          key: space-2
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-3
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-3
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
    - type: external-link
      key: external-link-1
      title: Discord
      icon: discord
      url: https://discord.com/invite/wvVJ8GV4PS
      draft: true
